[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tgs-agent"
version = "3.2.0"
description = "TGS Search Agent — a self-correcting web agent with adaptive routing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["openai>=1.0", "duckduckgo-search>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tgs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
